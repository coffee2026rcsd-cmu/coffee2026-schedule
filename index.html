<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programme · 3rd International Symposium on Coffee 2026</title>
<meta name="description" content="Programme of the 3rd International Symposium on Coffee, 27–28 November 2026, Faculty of Social Sciences, Chiang Mai University.">
<!-- Everything is in this file and schedule.json next to it: no fonts, scripts or images from Google or any other host. -->
<style>
  :root{--bg:#f7f5f1;--surface:#fff;--ink:#1d1a16;--ink-2:#4b443c;--ink-3:#8b8279;--line:#e8e2d9;--accent:#8a5a2b;--accent-soft:#f2e9df;--live:#2f7a4a}
  @media (prefers-color-scheme:dark){:root{--bg:#161412;--surface:#201d1a;--ink:#f1ece6;--ink-2:#cfc6bc;--ink-3:#958b80;--line:#332e29;--accent:#d9a46c;--accent-soft:#2c241c;--live:#6cc08c}}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans Thai",sans-serif}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{padding:48px 0 18px}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:clamp(24px,3.4vw,38px);line-height:1.15;letter-spacing:-.015em;margin:10px 0 12px;font-weight:700;max-width:900px}
  .meta{color:var(--ink-2);font-size:14px}
  .lang{float:right;display:flex;gap:2px;font-size:12px;margin-top:2px}
  .lang button{border:0;background:none;color:var(--ink-3);padding:4px 8px;border-radius:999px;cursor:pointer;font:inherit}
  .lang button[aria-pressed=true]{color:var(--ink);background:var(--accent-soft)}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
  .days{display:flex;gap:4px}
  .days button{border:0;background:none;font:inherit;font-weight:700;color:var(--ink-3);padding:8px 14px;border-radius:999px;cursor:pointer}
  .days button span{font-weight:400;margin-left:6px}
  .days button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .search{flex:1;min-width:180px;max-width:360px;margin-left:auto;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  .now{display:none}
  .views{display:flex;gap:2px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line)}
  .views button{border:0;background:none;font:inherit;font-weight:700;color:var(--ink-3);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .views button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .views .n{display:inline-block;min-width:18px;font-size:11px;line-height:18px;border-radius:999px;background:var(--accent);color:#fff;margin-left:5px;text-align:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .chips[hidden]{display:none}
  .chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px;margin-top:22px;font-size:13.5px}
  .glance b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
  .glance span{display:block;color:var(--ink-2)}
  .glance button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .glance button:hover b{color:var(--accent)}
  .nownext{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px}
  .nownext[hidden]{display:none}
  .nownext button{border:0;font:inherit;color:inherit;text-align:left;background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;cursor:pointer}
  .nownext small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#d9a46c}
  .nownext b{display:block;margin:3px 0 1px;line-height:1.3}
  .nownext span{font-size:12.5px;opacity:.75}
  .star{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;color:var(--ink-3);padding:2px 4px;vertical-align:-1px}
  .star[aria-pressed=true]{color:var(--accent)}
  .session .star{position:absolute;right:6px;top:6px}
  .session.card{position:relative}
  .people-ix{columns:2;column-gap:36px;margin-top:6px}
  .people-ix .letter{font-weight:700;color:var(--accent);margin:16px 0 2px;break-after:avoid}
  .people-ix button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;break-inside:avoid}
  .people-ix button:hover b{color:var(--accent)}
  .people-ix .mt{display:block;font-size:12.5px;color:var(--ink-3)}
  .mine-empty{padding:40px 0;color:var(--ink-3);max-width:520px}
  main{padding:8px 0 80px}
  .block{display:grid;grid-template-columns:118px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:90px}
  .block:first-child{border-top:0}
  .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .time small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .block.live .time{color:var(--live)}
  .block.live .time::after{content:"● now";display:block;font-size:11px;letter-spacing:.06em;margin-top:6px}
  .block.quiet{padding:12px 0}
  .block.quiet .bt{color:var(--ink-3);font-size:14px}
  .bt{font-size:18px;font-weight:700;line-height:1.3;margin:0}
  .kind{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .about{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:760px}
  .about summary{cursor:pointer;color:var(--ink-3);font-size:13px}
  .people{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
  .people li b{font-weight:700}
  .people .talk{display:block;color:var(--ink-2);font-size:14px}
  .people .aff,.paper .aff{color:var(--ink-3);font-size:13.5px}
  .mod{margin-top:10px;font-size:14px;color:var(--ink-2)}
  .lab{color:var(--ink-3)}
  .sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin-top:14px}
  .session,.paper{scroll-margin-top:90px}
  @media (max-width:640px){.block,.session{scroll-margin-top:130px}}
  .sh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .code{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:6px}
  .room{font-size:12.5px;color:var(--ink-3)}
  .sname{font-size:16px;font-weight:700;line-height:1.3;margin:6px 0 2px}
  .session.card{cursor:pointer;border-radius:12px;margin:-10px;padding:10px;transition:background .15s}
  .session.card:hover{background:var(--accent-soft)}
  .session.card:hover .sname{color:var(--accent)}
  .names{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
  .names li{display:flex;gap:6px;align-items:baseline}
  .names li::before{content:attr(data-n);font-size:11.5px;font-weight:700;color:var(--ink-3);min-width:12px;font-variant-numeric:tabular-nums}
  .more{margin-top:8px;font-size:13px;font-weight:700;color:var(--accent);border:0;background:none;padding:0;font-family:inherit;cursor:pointer}
  .inside{font-size:11.5px;font-weight:700;color:var(--accent);margin-left:8px}
  .sheet-box.wide{max-width:780px}
  .sheet-box .sname{font-size:21px;margin:8px 30px 4px 0}
  .sheet-box .papers{margin-top:16px}
  .chair{font-size:13px;color:var(--ink-2)}
  .papers{list-style:none;margin:10px 0 0;padding:0;counter-reset:p}
  .paper{counter-increment:p;position:relative;padding:9px 0 9px 26px;border-top:1px solid var(--line)}
  .paper::before{content:counter(p);position:absolute;left:0;top:9px;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .paper .t{font-size:14px;line-height:1.4}
  .paper .who{font-size:13.5px;margin-top:2px}
  .online{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:6px;white-space:nowrap}
  .link{border:0;background:none;color:var(--ink-3);cursor:pointer;font:inherit;font-size:12px;padding:0 4px;opacity:.7}
  .link:hover{opacity:1;color:var(--accent)}
  @media (hover:hover){.link{opacity:0}.block:hover>div>.bt .link,.session:hover .link,.link:focus{opacity:.7}}
  .side{margin-top:6px}
  .side .ev{margin-top:8px}
  .side .ev b{font-weight:700}
  .hit{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px}
  .empty{padding:40px 0;color:var(--ink-3)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:.95}
  footer{color:var(--ink-3);font-size:12.5px;padding:24px 0 40px;border-top:1px solid var(--line)}
  @media (max-width:640px){
    .nownext{grid-template-columns:1fr}
    .bar{position:static}
    .views{border-left:0;padding-left:0;margin-left:0;width:100%}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .people-ix{columns:1}
    header{padding:28px 0 10px}
    .block{grid-template-columns:1fr;gap:6px}
    .block.live .time::after{display:inline;margin-left:8px}
    .search{max-width:none;margin-left:0}
    .sessions{gap:22px}
  }
  @media print{
    .bar,.lang,.link,.toast,.more,.where,.rooms-sec,.sheet{display:none!important}
    body{background:#fff;color:#000;font-size:11pt}
    .day{display:block!important;break-before:page}
    .day:first-of-type{break-before:auto}
    .day h2{display:block!important}
    .block{break-inside:avoid}
  }
  .day h2{display:none;font-size:20px;margin:24px 0 0}
  .sponsors{padding:34px 0 26px;border-top:1px solid var(--line)}
  .spg{margin-bottom:24px}
  .spg h4{margin:0 0 12px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .logos{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:center}
  .logos a,.logos span{display:inline-flex;align-items:center}
  .logos img{display:block;width:auto;height:calc(var(--h,54) * 1px);max-width:min(calc(var(--h,54) * 5px),100%);object-fit:contain}
  @media (max-width:640px){.logos{gap:18px 26px}.logos img{height:calc(var(--h,54) * .78px)}}
  .logos .txt{font-weight:700;font-size:14px;color:var(--ink-2)}
  @media (prefers-color-scheme:dark){.logos img{background:#fff;border-radius:6px;padding:4px}}
  .where{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .pin{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--ink);color:var(--bg);padding:7px 13px 7px 10px;border-radius:999px;font-size:13.5px;font-weight:700}
  .pin svg{width:16px;height:16px;flex:none}
  .pin.alt{background:var(--accent-soft);color:var(--ink)}
  .pin.ghost{background:none;color:var(--ink);border:1px solid var(--line);cursor:pointer;font:inherit;font-size:13.5px;font-weight:700}
  .rooms-sec{margin:44px 0 0;padding-top:22px;border-top:1px solid var(--line)}
  .rooms-sec h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px}
  .slides{position:relative}
  .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;border-radius:14px}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start;margin:0}
  .slide img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:14px;display:block;background:var(--line)}
  .slide figcaption{margin-top:8px;font-size:14px}
  .slide figcaption b{display:block}
  .slide figcaption span{color:var(--ink-2);font-size:13px}
  .nav{position:absolute;top:calc(33.3% - 18px);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#222;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .nav.prev{left:10px}.nav.next{right:10px}
  .nav[disabled]{opacity:0;pointer-events:none}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
  .dots button[aria-current="true"]{background:var(--accent)}
  .sheet-box .slide img{border-radius:12px}
  .slide img{cursor:zoom-in}
  .zoom{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.92);display:flex;align-items:center;justify-content:center;padding:16px}
  .zoom[hidden]{display:none}
  .zoom img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;border-radius:8px;cursor:zoom-out}
  .zoom figcaption{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#eee;font-size:14px}
  .zoom .zx{position:absolute;right:14px;top:8px;border:0;background:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
  .roomlink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted currentColor}
  .roomlink:hover{color:var(--accent)}
  .ptoggle{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%}
  .ptoggle:hover .t{color:var(--accent)}
  .ptoggle .t::after{content:" +";color:var(--ink-3);font-weight:700}
  .paper.open .ptoggle .t::after{content:" −"}
  .abs{display:none;margin:8px 0 2px;font-size:13.5px;line-height:1.6;color:var(--ink-2);white-space:pre-line}
  .paper.open .abs{display:block}
  .abs .kw{display:block;margin-top:8px;color:var(--ink-3);font-size:12.5px}
  .sheet{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet[hidden]{display:none}
  .sheet-box{background:var(--surface);color:var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px 22px 24px;position:relative}
  .sheet-box .slides{margin:12px 0 0}
  .sheet-x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:26px;line-height:1;color:var(--ink-3);cursor:pointer}
  .sheet h3{margin:0 30px 4px 0;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="zh" aria-pressed="false">中文</button></div>
    <div class="eyebrow" id="subtitle">3rd International Symposium on Coffee · 27–28 November 2026</div>
    <h1 id="title">Programme</h1>
    <div class="meta" id="venue"></div>
    <div class="where" id="where" hidden></div>
    <div class="nownext" id="nownext" hidden></div>
    <div class="glance" id="glance"></div>
  </header>
  <div class="bar">
    <div class="days" id="days" role="tablist"></div>
    <div class="views" id="views"></div>
    <input class="search" id="q" type="search" placeholder="Search a name, title or room" aria-label="Search">
    <div class="chips" id="chips" hidden></div>
    <div class="now" id="now" hidden></div>
  </div>
  <main id="main"><div class="empty" id="loading">Loading the programme…</div></main>
  <section class="rooms-sec" id="rooms" hidden></section>
  <section class="sponsors" id="sponsors" hidden></section>

</div>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet" hidden><div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetT"><button class="sheet-x" data-close aria-label="Close">×</button><div id="sheetBody"></div></div></div>

(function () {

      var inSheet = !!sb.closest('#sheet');
      render();
      if (inSheet) { var nb = $('sheet').querySelector('[data-star]'); if (nb) { nb.setAttribute('aria-pressed', String(!!STAR[sid0])); nb.textContent = STAR[sid0] ? '★' : '☆'; } }
      toast(STAR[sid0] ? '★ ' + t('mine') : t('unstar'));
      return;
    }
    var vw = e.target.closest('[data-view]');
    if (vw) { var v = vw.getAttribute('data-view'); VIEW = VIEW === v ? 'day' : v; Q = ''; $('q').value = ''; render(); window.scrollTo({ top: Math.min(window.scrollY, $('main').offsetTop - 80) }); return; }
    var ch = e.target.closest('[data-chip]');
    if (ch) { var ck = ch.getAttribute('data-chip'); CHIP[ck] = !CHIP[ck]; render(); return; }
    var jp = e.target.closest('[data-jump]');
    if (jp) { var jid = jp.getAttribute('data-jump'); VIEW = 'day'; Q = ''; $('q').value = '';
      DATA.days.forEach(function (d, i) { d.blocks.forEach(function (b) { if (b.id === jid) DAY = i; }); }); render();
      var el0 = document.getElementById(jid); if (el0) el0.scrollIntoView({ block: 'center' }); return; }
    var rm = e.target.closest('[data-room]');
    if (!rm && !e.target.closest('[data-link]')) { var ss = e.target.closest('[data-sess]'); if (ss) { var pq = ss.getAttribute('data-p'); if (pq) OPEN[pq] = true; openSession(ss.getAttribute('data-sess'), pq); return; } }
    if (rm) { openRoom(rm.getAttribute('data-room')); return; }
    if (e.target.closest('[data-unzoom]') || e.target === $('zoom') || e.target.closest('#zoom img')) { $('zoom').hidden = true; return; }
    var zi = e.target.closest('.slide img');
    if (zi) { var z = $('zoom'), cap = zi.closest('.slide').querySelector('figcaption');
      z.querySelector('img').src = zi.getAttribute('src'); z.querySelector('img').alt = zi.alt; z.querySelector('figcaption').textContent = cap ? cap.textContent : '';
      z.hidden = false; return; }
    var st = e.target.closest('[data-step],[data-go]');
    if (st) { var sl = st.closest('.slides'), tr = sl.querySelector('.track'), cur = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth + 12));
      goSlide(sl, st.hasAttribute('data-go') ? Number(st.getAttribute('data-go')) : Math.max(0, Math.min(tr.children.length - 1, cur + Number(st.getAttribute('data-step'))))); return; }
    var gt = e.target.closest('[data-goto]');
    if (gt) { $(gt.getAttribute('data-goto')).scrollIntoView({ behavior: 'smooth' }); return; }
    if (e.target.closest('[data-close]') || e.target === $('sheet')) { $('sheet').hidden = true; return; }
    var pp = e.target.closest('[data-paper]');
    if (pp) { var id = pp.getAttribute('data-paper'), li = pp.closest('.paper'); OPEN[id] = !li.classList.contains('open'); li.classList.toggle('open', OPEN[id]); pp.setAttribute('aria-expanded', String(OPEN[id])); return; }
    var d = e.target.closest('[data-day]');
    if (d) { DAY = Number(d.getAttribute('data-day')); VIEW = 'day'; Q = ''; $('q').value = ''; history.replaceState(null, '', '#day' + (DAY + 1)); render();
      if (d.closest('#glance')) $('main').scrollIntoView({ behavior: 'smooth' }); else window.scrollTo({ top: Math.min(window.scrollY, $('main').offsetTop - 80) }); return; }
    var l = e.target.closest('[data-lang]');
    if (l) { L = l.getAttribute('data-lang'); try { localStorage.setItem('lang', L); } catch (x) {} render(); return; }
    var k = e.target.closest('[data-link]');
    if (k) {
      var url = location.href.split('#')[0] + '#' + k.getAttribute('data-link');
      history.replaceState(null, '', '#' + k.getAttribute('data-link'));
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast(t('copy')); }, function () { toast(url); });
    }
  });
  $('q').addEventListener('input', function (e) { Q = e.target.value.trim(); render(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('zoom').hidden) { $('zoom').hidden = true; return; } $('sheet').hidden = true; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('article[data-sess]')) { e.preventDefault(); openSession(e.target.getAttribute('data-sess')); }
  });
  function goHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h || !DATA) return;
    var m = h.match(/^day(\d)$/i);
    if (m) { DAY = Math.max(0, Math.min(DATA.days.length - 1, Number(m[1]) - 1)); VIEW = 'day'; render(); return; }
    if (/^(mine|people)$/.test(h)) { VIEW = h; render(); return; }
    var sid = null, pid = null;
    DATA.days.forEach(function (d, i) {
      d.blocks.forEach(function (b) {
        (b.sessions || []).forEach(function (s) { (s.papers || []).forEach(function (p, k) { if ((s.code || b.id) + '-' + (k + 1) === h) { DAY = i; OPEN[h] = true; sid = sessId(b, s); pid = h; } }); });
        (b.sessions || []).forEach(function (s) { if (sessId(b, s) === h) { DAY = i; sid = h; } });
        if (b.id === h) DAY = i;
      });
    });
    render();
    if (sid) { var card = document.getElementById(sid); if (card) card.scrollIntoView({ block: 'center' }); openSession(sid, pid); return; }
    var el = document.getElementById(h);
    if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); el.style.transition = 'background .6s'; el.style.background = 'var(--accent-soft)'; setTimeout(function () { el.style.background = ''; }, 1400); }, 30);
  }
  function load() {
    if (window.__SCHEDULE__) { DATA = window.__SCHEDULE__; render(); goHash(); return; }   // a preview with the data built in
    var src = (location.search.match(/[?&]data=([^&]+)/) || [])[1] || 'schedule.json';
    fetch(decodeURIComponent(src) + (src.indexOf('?') === -1 ? '?' : '&') + 't=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        DATA = d;
        var clock = bkk();
        DATA.days.forEach(function (x, i) { if (isoOf(x) === clock.date) DAY = i; });   // on the day, open today
        render(); goHash();
      })
      .catch(function () { $('main').innerHTML = '<div class="empty">' + esc(t('failed')) + '</div>'; });
  }
  window.addEventListener('hashchange', goHash);
  setInterval(function () { if (DATA && !Q && $('sheet').hidden && document.activeElement !== $('q')) render(); }, 60000);   // keep "now" in step
  render(); load();
})();
</script>
