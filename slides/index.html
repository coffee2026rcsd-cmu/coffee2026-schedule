<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f5f1">
<link rel="icon" type="image/png" href="../brand/favicon.png">
<title>Slides by room · 3rd International Symposium on Coffee</title>
<style>
  :root{--bg:#f7f5f1;--surface:#fff;--soft:#efe9e1;--ink:#1d1a16;--ink-2:#4b443c;--ink-3:#7d746a;--line:#e8e2d9;--accent:#8a5a2b;--bad:#9b2c2c;--blue:#1f5878}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue",Helvetica,Arial,"PingFang SC","Noto Sans Thai",sans-serif;-webkit-tap-highlight-color:transparent}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px 60px}
  .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-size:28px;margin:8px 0 6px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:14px;color:var(--ink-3)}
  .lnk{border:0;background:none;padding:0;color:var(--ink-2);font-weight:600;cursor:pointer;font-size:14px}
  .login{max-width:340px;margin:12vh auto 0;text-align:center}
  .login h1{font-size:26px}
  .login .sub{color:var(--ink-3);font-size:15px;margin-bottom:22px}
  .login input{display:block;width:100%;margin:0 0 10px;padding:13px 16px;border-radius:12px;border:0;background:var(--surface);font-size:17px;text-align:center;outline:none}
  .login input:focus{box-shadow:0 0 0 2px var(--accent)}
  .btn{border:0;border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;font-size:15px}
  .btn.dl{background:var(--accent);padding:8px 18px;font-size:14px}
  .btn.ghost{background:var(--surface);color:var(--ink)}
  .btn.small{padding:8px 16px;font-size:14px}
  .btn:disabled{opacity:.55;cursor:default}
  .err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
  .tabs+.tabs{margin-top:10px}
  .tabs button{border:0;background:var(--soft);color:var(--ink-2);font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
  .tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
  .sum{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:26px 0 4px;font-size:14px;color:var(--ink-3)}
  .s{padding:26px 0 8px}
  .s+.s{border-top:1px solid var(--line)}
  .when{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.02em}
  .s h2{font-size:19px;font-weight:600;line-height:1.3;margin:4px 0 2px}
  .s .sub{font-size:13px;color:var(--ink-3)}
  .t{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 0}
  .t .n{color:var(--ink-3);padding-top:1px}
  .t .who{font-weight:600}
  .t .ttl{font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
  .t .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-left:8px}
  .t .act{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;min-width:170px}
  .t .fn{font-size:12px;color:var(--ink-3);max-width:250px;overflow-wrap:anywhere}
  .t .none{font-size:13px;color:var(--bad)}
  .t .none.q{color:var(--ink-3)}
  a.btn{text-decoration:none;display:inline-block}
  .empty{color:var(--ink-3);padding:40px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .2s,opacity .2s;max-width:90vw}
  .toast.on{transform:translateX(-50%);opacity:1}
  .toast.bad{background:var(--bad)}
  .foot{margin-top:40px;font-size:12px;color:var(--ink-3)}
  [hidden]{display:none!important}
  @media (max-width:640px){
    h1{font-size:24px}
    .t{grid-template-columns:24px minmax(0,1fr)}
    .t .act{grid-column:2;align-items:flex-start;text-align:left;min-width:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login" autocomplete="on">
    <div class="eyebrow">3rd International Symposium on Coffee</div>
    <h1>Slides by room</h1>
    <div class="sub">For the volunteers at each room. Sign in with the username and password from the organizers.</div>
    <input id="u" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="lbtn" type="submit">Sign in</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
  <div id="app" hidden></div>
  <div class="foot">For room volunteers only · RCSD, Faculty of Social Sciences, Chiang Mai University</div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxX_SZjeewSaR6e5FmH4Kvwq-iw9PWhLZSzk18p_3Hp5ATs8v8xcxHJqdWfollVmS0m/exec';
  var S = { token: '', d: null, room: '', day: '', busy: false };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var tt = null;
  function toast(m, bad) { var t = $('toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast' + (bad ? ' bad' : ''); }, 3200); }
  function call(req) {
    if (S.token && req.op !== 'roomLogin') req.token = S.token;
    return fetch(API, { method: 'POST', body: JSON.stringify(req) })   // text/plain: no preflight
      .then(function (r) { return r.json(); }, function () { throw new Error('No connection — try again.'); })
      .then(function (d) {
        if (d && d.ok === false) {
          var msg = String(d.error || 'Something went wrong.').replace(/^AUTH: /, '');
          if (/^AUTH: /.test(d.error || '')) signOut(msg);
          throw new Error(msg);
        }
        return d;
      });
  }
  /* ---- sign in ---- */
  try { var keep = JSON.parse(load('rs-pick') || '{}'); S.room = keep.room || ''; S.day = keep.day || ''; } catch (e) {}
  $('u').value = load('rs-user') || '';
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!$('u').value.trim() || !$('p').value) { $('lerr').textContent = 'Type the username and the password.'; return; }
    $('lbtn').disabled = true; $('lerr').textContent = '';
    call({ op: 'roomLogin', user: $('u').value.trim(), pass: $('p').value }).then(function (d) {
      S.token = d.token; store('rs-token', d.token); store('rs-user', $('u').value.trim());
      $('p').value = ''; S.d = d.home; store('rs-home', JSON.stringify(d.home)); show();
    }).catch(function (err) { $('lerr').textContent = err.message; $('p').value = ''; $('p').focus(); })
      .then(function () { $('lbtn').disabled = false; });
  });
  function signOut(msg) {
    store('rs-token', null); store('rs-home', null); S.token = ''; S.d = null;
    $('app').hidden = true; $('login').hidden = false; $('lerr').textContent = msg || '';
    setTimeout(function () { ($('u').value ? $('p') : $('u')).focus(); }, 30);
  }
  function show() { $('login').hidden = true; $('app').hidden = false; render(); }
  function refresh(quiet) {
    return call({ op: 'roomHome' }).then(function (d) { S.d = d.home; store('rs-home', JSON.stringify(d.home)); render(); if (!quiet) toast('Up to date'); });
  }
  /* ---- the page ---- */
  function cur() {
    var d = S.d || { rooms: [] }, R = d.rooms.filter(function (r) { return r.room === S.room; })[0] || d.rooms[0] || null;
    if (!R) return { R: null, D: null };
    S.room = R.room;
    var D = R.days.filter(function (x) { return x.day === S.day; })[0];
    if (!D) {   // on a symposium day, that day; otherwise the first
      var t = new Date(String(d.today || '') + 'T12:00:00');
      D = R.days.filter(function (x) { var v = new Date(x.date); return !isNaN(v) && !isNaN(t) && v.toDateString() === t.toDateString(); })[0] || R.days[0] || null;
    }
    S.day = D ? D.day : '';
    return { R: R, D: D };
  }
  function pick() { store('rs-pick', JSON.stringify({ room: S.room, day: S.day })); }
  function fileName(s, t) {
    var hm = String(s.start || '').match(/^(\d{1,2}):(\d{2}) (AM|PM)$/), h = hm ? (Number(hm[1]) % 12) + (hm[3] === 'PM' ? 12 : 0) : 0;
    var at = hm ? (h < 10 ? '0' : '') + h + hm[2] : '';
    var last = String(t.presenter || '').split(',')[0].trim().split(/\s+/).pop() || 'Presenter';
    return ((at ? at + ' ' : '') + (s.code ? s.code + '-' : '') + t.order + ' ' + last + ' - ' + t.slides.name).replace(/[\\/:*?"<>|\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function size(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  /** One file, piece by piece through the app (the files stay private in Drive). */
  function fetchFile(sid, onStep) {
    var parts = [], meta = null;
    var next = function (i) {
      return call({ op: 'roomSlides', sid: sid, part: i }).then(function (r) {
        meta = r;
        var bin = atob(r.b64), b = new Uint8Array(bin.length);
        for (var k = 0; k < bin.length; k++) b[k] = bin.charCodeAt(k);
        parts.push(b);
        if (onStep) onStep((i + 1) / r.parts);
        return i + 1 < r.parts ? next(i + 1) : new Blob(parts, { type: r.mime || 'application/octet-stream' });
      });
    };
    return next(0).then(function (blob) { return { blob: blob, meta: meta }; });
  }
  function save(name, blob) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
  }
  var ZIP = null;
  function jszip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (ZIP) return ZIP;
    ZIP = new Promise(function (ok, fail) {
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = function () { ok(window.JSZip); }; s.onerror = function () { ZIP = null; fail(new Error('Could not load the zip tool — check the connection.')); };
      document.head.appendChild(s);
    });
    return ZIP;
  }
  function render() {
    var el = $('app'), d = S.d;
    if (!d) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
    var c = cur(), R = c.R, D = c.D;
    var all = D ? D.sessions.reduce(function (a, s) { return a.concat(s.talks.map(function (t) { return { s: s, t: t }; })); }, []) : [];
    var files = all.filter(function (x) { return x.t.slides.has; }), portal = all.filter(function (x) { return x.t.slides.page; });
    var inn = portal.filter(function (x) { return x.t.slides.has || x.t.slides.link; });
    var h = '<div class="eyebrow">3rd International Symposium on Coffee · Slides by room</div><h1>' + esc(R ? R.label : 'No rooms yet') + '</h1>' +
      '<div class="meta"><span>' + esc(D ? D.day + (D.date ? ', ' + D.date : '') : '') + '</span><span>Updated ' + esc(d.loadedAt || '') + '</span>' +
      '<button class="lnk" id="ref">Refresh</button><button class="lnk" id="out">Sign out</button></div>';
    if (R) {
      h += '<div class="tabs" role="group" aria-label="Room">' + d.rooms.map(function (r) { return '<button data-room="' + esc(r.room) + '" aria-pressed="' + (r.room === R.room) + '">' + esc(r.label) + '</button>'; }).join('') + '</div>';
      if (R.days.length > 1) h += '<div class="tabs" role="group" aria-label="Day">' + R.days.map(function (x) { return '<button data-day="' + esc(x.day) + '" aria-pressed="' + (D && x.day === D.day) + '">' + esc(x.day + (x.date ? ' · ' + x.date.replace(/ \d{4}$/, '') : '')) + '</button>'; }).join('') + '</div>';
      h += '<div class="sum"><span>' + inn.length + ' of ' + portal.length + ' presenters have sent slides' + (all.length > portal.length ? ' · ' + (all.length - portal.length) + ' speakers bring their own' : '') + '</span>' +
        (files.length ? '<button class="btn ghost small" id="zip">Download this day as .zip (' + files.length + ' file' + (files.length === 1 ? '' : 's') + ')</button>' : '') + '<span id="zst"></span></div>';
      h += (D ? D.sessions : []).map(function (s) {
        return '<section class="s"><div class="when">' + esc(s.start + (s.end ? ' – ' + s.end : '')) + '</div><h2>' + esc((s.code ? s.code + ' · ' : '') + s.title) + '</h2>' +
          (s.chair ? '<div class="sub">' + (s.kind === 'panel' ? 'Chair and discussant' : 'Moderator') + ': ' + esc(s.chair) + '</div>' : '') +
          s.talks.map(function (t) {
            var f = t.slides, act = '';
            if (f.has) act += '<button class="btn dl" data-dl="' + esc(t.sid) + '" data-name="' + esc(fileName(s, t)) + '">Download</button><span class="fn">' + esc(f.name) + (f.at ? ' · ' + esc(f.at) : '') + '</span>';
            if (f.link) act += '<a class="btn ghost small" href="' + esc(f.link) + '" target="_blank" rel="noopener">Open their link ↗</a>';
            if (!f.has && !f.link) act += f.page ? '<span class="none">No slides yet</span>' : '<span class="none q">Not sent online — ask the speaker</span>';
            return '<div class="t"><span class="n">' + t.order + '</span><div><div class="who">' + esc(t.presenter || 'To be confirmed') + (t.online ? '<span class="tag">Online</span>' : '') + '</div>' +
              (t.title ? '<div class="ttl">' + esc(t.title) + '</div>' : '') + '</div><div class="act">' + act + '</div></div>';
          }).join('') + '</section>';
      }).join('') || '<div class="empty">No sessions in this room on this day.</div>';
    } else h += '<div class="empty">Nothing is on the timetable yet.</div>';
    el.innerHTML = h;
    $('out').addEventListener('click', function () { signOut(''); });
    $('ref').addEventListener('click', function () { var b = this; b.disabled = true; b.textContent = 'Refreshing…'; refresh().catch(function (e) { toast(e.message, true); }).then(function () { b.disabled = false; b.textContent = 'Refresh'; }); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-room]'), function (x) { x.addEventListener('click', function () { S.room = x.getAttribute('data-room'); S.day = ''; pick(); render(); }); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-day]'), function (x) { x.addEventListener('click', function () { S.day = x.getAttribute('data-day'); pick(); render(); }); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-dl]'), function (x) {
      x.addEventListener('click', function () {
        if (x.disabled) return;
        x.disabled = true; x.textContent = 'Downloading…';
        fetchFile(x.getAttribute('data-dl'), function (fr) { x.textContent = 'Downloading ' + Math.round(fr * 100) + '%'; })
          .then(function (r) { save(x.getAttribute('data-name'), r.blob); x.textContent = 'Downloaded ✓'; toast('Saved · ' + size(r.meta.size)); })
          .catch(function (e) { x.textContent = 'Download'; toast(e.message, true); })
          .then(function () { x.disabled = false; });
      });
    });
    var z = $('zip');
    if (z) z.addEventListener('click', function () {
      if (S.busy) return;
      S.busy = true; z.disabled = true;
      var st = $('zst'), done = 0, failed = [];
      jszip().then(function (JSZip) {
        var zip = new JSZip(), list = files.slice();
        var step = function () {
          if (!list.length) return zip.generateAsync({ type: 'blob' });
          var x = list.shift();
          st.textContent = 'File ' + (done + 1) + ' of ' + files.length + '…';
          return fetchFile(x.t.sid).then(function (r) { zip.file(fileName(x.s, x.t), r.blob); }, function () { failed.push(x.t.presenter); })
            .then(function () { done++; return step(); });
        };
        return step();
      }).then(function (blob) {
        save((R.label + ' - ' + (D ? D.day : '') + ' slides.zip').replace(/[\\/:*?"<>|]+/g, ' '), blob);
        st.textContent = failed.length ? 'Saved, without: ' + failed.join(', ') : 'Saved ✓';
      }).catch(function (e) { st.textContent = ''; toast(e.message, true); })
        .then(function () { S.busy = false; z.disabled = false; });
    });
  }
  /* ---- open: the last copy at once, then the fresh one ---- */
  S.token = load('rs-token') || '';
  if (S.token) {
    try { S.d = JSON.parse(load('rs-home') || 'null'); } catch (e) { S.d = null; }
    show();
    refresh(true).catch(function (e) { if (S.token) toast(e.message, true); });
  } else setTimeout(function () { ($('u').value ? $('p') : $('u')).focus(); }, 30);
})();
</script>
</body>
</html>
